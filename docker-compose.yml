services:
  harness:
    build: .
    command: tail -f /dev/null # keeps container alive without running main
    env_file:
      - .env
    environment:
      # Proxy settings for harness container to route traffic through proxy
      - HTTP_PROXY=http://proxy:8888
      - HTTPS_PROXY=http://proxy:8888
      - http_proxy=http://proxy:8888
      - https_proxy=http://proxy:8888
      - NO_PROXY=localhost,127.0.0.1
      - CONFIG=${CONFIG:-icasa}
      - PLAYBOOK=${PLAYBOOK:-0}
      - EMBEDDINGS=${EMBEDDINGS:-0}
    networks:
      - internal
    depends_on:
      - proxy
    volumes:
      # manages access
      - ./src:/app/src:ro
      # only this config's memory snapshot is visible to the agent
      - ./memory_snapshots/${CONFIG:-icasa}:/app/src/memory/data:ro
      - ./data:/app/data:ro
      - ./input:/app/input:ro
      - ./workspace:/app/workspace
      - ./output:/app/output
      - ./tests:/app/tests:ro
    tmpfs:
      - /app/runs # hide archived runs
      - /app/observability # hide trace analysis
      - /app/VibeCoded # hide vibe-coded scripts

  # Builds the memory snapshot for one config
  snapshot:
    build: .
    profiles: [build]
    command: python -m src.build_snapshot
    environment:
      - PLAYBOOK=${PLAYBOOK:-0}
      - EMBEDDINGS=${EMBEDDINGS:-0}
      - CHROMA_DIR=/app/snapshot/chroma
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./memory_snapshots/${CONFIG:-icasa}:/app/snapshot

  proxy:
    build: ./proxy
    networks:
      - internal
      - egress

networks:
  internal:
    internal: true
  egress:
    driver: bridge