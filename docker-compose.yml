services:
  harness:
    build: .
    command: tail -f /dev/null
    env_file:
      - .env
    networks:
      - internal
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./workspace:/app/workspace
      - ./output:/app/output

networks:
  internal:
    driver: bridge
    internal: true