services:
  harness:
    environment:
      - FARMONIZER_CONFIG=${FARMONIZER_CONFIG:-icasa}
      - FARMONIZER_MODEL=${FARMONIZER_MODEL:-openai:gpt-5.6-sol}
    extends:
      file: docker-compose.yml
      service: harness
    command: python src/main.py
    depends_on:
      - proxy
    tmpfs:
      - /app/src/rag

  proxy:
    extends:
      file: docker-compose.yml
      service: proxy

networks:
  internal:
    internal: true
  egress:
    driver: bridge